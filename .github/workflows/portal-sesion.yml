name: Probar sesión del portal

on:
  push:
    branches: [main]
    paths: ['admin_usuarios.html', 'tests/admin_sesion.test.cjs', 'index.html', 'datos/supabase-js.min.js', 'tests/portal_sesion.test.cjs', '.github/workflows/portal-sesion.yml']
  pull_request:
    paths: ['admin_usuarios.html', 'tests/admin_sesion.test.cjs', 'index.html', 'datos/supabase-js.min.js', 'tests/portal_sesion.test.cjs', '.github/workflows/portal-sesion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sesion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/portal_sesion.test.cjs tests/admin_sesion.test.cjs
