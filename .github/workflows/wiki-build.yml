name: Build wiki (MkDocs Material)

# Dispara en cada push a main que TOQUE la wiki (fuente o config),
# excluyendo el output generado (wiki-site/) para evitar loops.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-build.yml'
      - '!wiki-site/**'
  workflow_dispatch:  # permite dispararlo a mano desde GitHub Actions

# Necesario para que el commit al final pueda pushear al repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wiki/requirements.txt

      - name: Install MkDocs + Material
        run: pip install -r wiki/requirements.txt

      - name: Build MkDocs site → wiki-site/
        run: |
          cd wiki
          mkdocs build --site-dir ../wiki-site --strict

      - name: Commit wiki-site/ si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki-site/
          if git diff --cached --quiet; then
            echo "Sin cambios en wiki-site/ — nada que commitear."
          else
            git commit -m "chore(wiki): rebuild site [skip ci]" -m "Generado automáticamente por wiki-build.yml desde wiki/**."
            git push
          fi
