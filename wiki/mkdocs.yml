site_name: SIG Vial PBA · Guía de Usuario
site_description: Sistema de Información Geográfica Vial · Provincia de Buenos Aires · DVBA
site_author: Dirección de Vialidad de la Provincia de Buenos Aires
site_url: https://lemeit.github.io/DVBA/wiki-site/

repo_name: lemeit/DVBA
repo_url: https://github.com/lemeit/DVBA
edit_uri: ''

docs_dir: docs  # los .md editables viven directamente acá (sin traductor Obsidian)

# Excluir archivos que están en docs/ pero no forman parte de la guía publicada
exclude_docs: |
  README.md
  00-Inicio.md

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo claro
  font:
    text: Encode Sans
    code: JetBrains Mono
  features:
    - navigation.instant       # SPA-like sin recargas
    - navigation.tracking      # URL refleja sección visible
    - navigation.tabs          # tabs de secciones grandes
    - navigation.sections      # agrupamiento visual del sidebar
    - navigation.expand        # sidebar expandido por default
    - navigation.top           # botón "volver arriba"
    - toc.follow               # TOC scrollea con el contenido
    - toc.integrate            # TOC integrado al sidebar (mejor para pantallas anchas)
    - search.suggest           # sugerencias en el buscador
    - search.highlight         # resalta términos buscados
    - content.code.copy        # botón copiar en bloques de código
    - content.action.edit      # botón editar (link al repo)

nav:
  - Guía de Usuario:
      - Índice: 00-Indice.md
      - Qué es el sistema: 01-Que-es-el-sistema.md
      - Primeros pasos: 02-Primeros-pasos.md
      - Modo Público: 03-Modo-Publico.md
      - Roles y Accesos: 04-Roles-y-Accesos.md
      - Portal Escritorio: 05-Portal-Escritorio.md
      - Panel Administración: 06-Panel-Administracion.md
      - App Móvil · Modo Básico: 07-App-Movil-Modo-Basico.md
      - App Móvil · Modo Avanzado: 08-App-Movil-Modo-Avanzado.md
      - Plan Seguridad Circulación: 09-Plan-Seguridad-Circulacion.md
      - Reportes Red Vial: 10-Reportes-Red-Vial.md
      - Reportes Dashboard Gerencial: 11-Reportes-Dashboard-Gerencial.md
      - Sello Institucional: 12-Sello-Institucional.md
      - Modo Offline: 13-Modo-Offline.md
      - FAQ: 14-FAQ.md
  - Guía Visual: Guia-Visual-Complementaria.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: '¶'
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/mockups.css  # v1.0 · reproduce los mockups de UI de la guía visual

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lemeit/DVBA
      name: Repositorio DVBA
  generator: false  # oculta "Made with Material for MkDocs"

copyright: >
  © 2026 Dirección de Vialidad de la Provincia de Buenos Aires ·
  Ministerio de Infraestructura y Servicios Públicos
