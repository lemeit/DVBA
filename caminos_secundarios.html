<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caminos Secundarios — DVBA Zona VI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f4f8;color:#1a2a3a}
#hdr{background:#003366;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hdr h1{font-size:.92rem;color:#fff;white-space:nowrap}
#hdr a.back{color:#adf;text-decoration:none;font-size:.74rem;border:1px solid #adf;padding:3px 7px;border-radius:4px}
#hdr a.back:hover{background:#adf;color:#003366}
#hdr .btn-rep{background:#28a745;color:#fff;border:none;padding:4px 10px;font-size:.74rem;border-radius:4px;cursor:pointer}
#hdr .btn-rep:hover{background:#34c95a}
#stats{font-size:.7rem;color:#adf;margin-left:auto}
#map{width:100%;height:calc(100vh - 40px)}
.ctrl{position:absolute;z-index:1000;background:rgba(255,255,255,.97);border-radius:6px;font-size:.78rem;color:#1a2a3a;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* Chip selector partido + filtros */
#pnl-top{position:absolute;top:52px;left:10px;z-index:1000;display:flex;gap:6px;align-items:flex-start;flex-direction:column}
.chip{padding:5px 10px;border-radius:14px;background:#fff;border:1px solid #ccc;cursor:pointer;font-size:.72rem;color:#1a2a3a;display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chip:hover{background:#eef5ff;border-color:#003366}
.chip.activo{background:#003366;color:#fff;border-color:#003366}
.chip .arrow{font-size:.6rem;opacity:.6}

#pnl-partido{padding:8px 10px;width:280px;display:none}
#pnl-partido.open{display:block}
#pnl-partido select{width:100%;padding:4px;font-size:.75rem;border:1px solid #ccc;border-radius:3px;background:#fff}
#pnl-partido .resumen{margin-top:6px;line-height:1.4;font-size:.68rem;color:#445}
#cks-partidos label.ck-chip{display:inline-flex !important;align-items:center;gap:3px;font-size:.68rem;cursor:pointer;padding:3px 7px;border-radius:10px;border:1px solid #ccc;background:#fff;margin:0 !important;flex-direction:row !important}
#cks-partidos label.ck-chip.on{background:#003366;color:#fff;border-color:#003366}
#cks-partidos label.ck-chip input{display:none}
#cks-partidos{display:flex !important;flex-direction:row !important;flex-wrap:wrap;gap:4px;max-height:none !important;overflow:visible !important}
.km-grande{font-size:1rem;color:#003366;font-weight:700}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.62rem;margin-right:2px;color:#fff}
.badge-tierra{background:#a07842}.badge-pavi{background:#3a7bd5}.badge-sinabrir{background:#888}
.badge-temp{background:#f0ad4e;color:#222}.badge-perm{background:#5cb85c}
.badge-rev{background:#28a745}.badge-pre{background:#f0ad4e;color:#222}

#pnl-partido h4{font-size:.72rem;color:#003366;margin-bottom:4px}
.filt-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filt-chip{padding:3px 8px;border-radius:10px;font-size:.62rem;cursor:pointer;border:1px solid;user-select:none}
.filt-chip.off{background:#fff;color:#888;border-color:#ccc;opacity:.6}

/* Tabla */
#btn-tabla{position:absolute;top:52px;right:10px;z-index:1000}
#pnl-tabla{top:90px;right:10px;width:330px;max-height:calc(100vh - 110px);overflow:auto;padding:0;display:none}
#pnl-tabla.open{display:block}
#pnl-tabla .th{background:#003366;color:#fff;padding:7px 10px;font-weight:700;font-size:.72rem;position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center}
#pnl-tabla .row{padding:6px 10px;border-bottom:1px solid #e8edf3;cursor:pointer;transition:background .15s}
#pnl-tabla .row:hover{background:#eef5ff}
#pnl-tabla .row.activo-camino{background:#fff5d6;border-left:4px solid #ffb800}
#pnl-tabla .nm{font-weight:700;color:#003366;font-size:.74rem}
#pnl-tabla .dn{font-size:.66rem;color:#555;margin-top:1px}
#pnl-tabla .km{font-size:.66rem;color:#003366;float:right}
#pnl-tabla .tramos{background:#f7f9fc}
#pnl-tabla .tramo{padding:4px 10px 4px 24px;font-size:.66rem;color:#445;border-bottom:1px solid #eef2f7;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#pnl-tabla .tramo:hover{background:#eef5ff}
#pnl-tabla .tramo.sel{background:#ffe9aa;border-left:4px solid #ff6600;padding-left:20px;font-weight:600}
.tklass{font-weight:600;font-size:.58rem;padding:1px 4px;border-radius:5px;color:#fff;margin-right:4px}
.k-tierra{background:#a07842}.k-pavi{background:#3a7bd5}.k-sinabrir{background:#888}

/* Selección flotante (acumulada) */
#pnl-sel{bottom:20px;left:10px;padding:10px 14px;display:none;max-width:340px}
#pnl-sel.activo{display:block}
#pnl-sel h4{font-size:.78rem;color:#003366;margin-bottom:4px}
#pnl-sel .resumen{font-size:.7rem;color:#445;line-height:1.5}
#pnl-sel .acciones{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#pnl-sel .btn{padding:4px 8px;font-size:.65rem;border:none;border-radius:3px;cursor:pointer;color:#fff}
#pnl-sel .btn-clear{background:#999}.btn-clear:hover{background:#666}
#pnl-sel .btn-csv{background:#28a745}.btn-csv:hover{background:#34c95a}
#pnl-sel .btn-rep{background:#003366}.btn-rep:hover{background:#004488}

/* Leyenda */
#pnl-leyenda{bottom:20px;right:10px;font-size:.66rem;padding:8px 10px}
#pnl-leyenda h4{color:#003366;margin-bottom:4px;font-size:.72rem}
.lg-item{display:flex;align-items:center;gap:5px;margin:2px 0}
.lg-line{display:inline-block;width:16px;height:3px;border-radius:1px}

/* Fuentes (estado partidos) */
#estado-fuentes{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);padding:4px 10px;font-size:.62rem;color:#445;z-index:1000;white-space:nowrap}
#estado-fuentes .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 2px;vertical-align:middle}
.dot-rev{background:#28a745}.dot-pre{background:#f0ad4e}

/* Popup Leaflet personalizado */
.leaflet-popup-content-wrapper{border-radius:6px}
.leaflet-popup-content{margin:10px 14px;font-size:.72rem;min-width:220px}
.leaflet-popup-content .pop-tit{font-weight:700;color:#003366;font-size:.82rem;margin-bottom:4px}
.leaflet-popup-content .pop-dn{font-size:.66rem;color:#666;margin-bottom:6px;font-style:italic}
.leaflet-popup-content .pop-row{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px solid #f0f0f0;font-size:.68rem}
.leaflet-popup-content .pop-row:last-child{border:none}
.leaflet-popup-content .pop-lbl{color:#777}
.leaflet-popup-content .pop-val{color:#003366;font-weight:600}
.leaflet-popup-content .pop-action{margin-top:8px;display:block;width:100%;padding:5px;background:#ff6600;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:.7rem;font-weight:600}
.leaflet-popup-content .pop-action.quitar{background:#999}
.leaflet-popup-content .pop-action:hover{opacity:.9}
/* Tooltip flotante de km al hover sobre un camino */
.leaflet-tooltip.prog-hover-tip{background:rgba(255,255,255,.95);border:1.5px solid #003366;color:#003366;padding:3px 7px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:.7rem;font-weight:600}
.leaflet-tooltip.prog-hover-tip::before{border-top-color:#003366}
.leaflet-popup-content .alerta{background:#fee;color:#a00;padding:4px 6px;border-radius:3px;margin-top:5px;font-size:.62rem}

/* Reporte (window.open) inherits browser default */
</style>
</head>
<body>
<div id="hdr">
  <h1>🛣 Caminos Secundarios — DVBA Zona VI</h1>
  <a class="back" href="./index.html">← Volver</a>
  <button class="btn-rep" onclick="generarReporte()">📊 Reporte</button>
  <div id="stats">cargando…</div>
</div>
<div id="map"></div>

<!-- Chip único de filtros (partidos + clase + mapa) en sup. izquierda -->
<div id="pnl-top">
  <div class="chip" id="chip-partido" onclick="togglePanel('pnl-partido')">🎛 <span id="chip-partido-txt">Todos los partidos</span> <span class="arrow">▾</span></div>
  <div class="ctrl" id="pnl-partido">
    <h4 style="font-size:.72rem;color:#003366;margin-bottom:4px">Partidos</h4>
    <div id="cks-partidos"></div>
    <div style="display:flex;gap:5px;margin-top:6px">
      <button onclick="setTodosPartidos(true)" style="flex:1;font-size:.62rem;padding:3px;border:1px solid #003366;background:#fff;color:#003366;border-radius:3px;cursor:pointer">Todos</button>
      <button onclick="setTodosPartidos(false)" style="flex:1;font-size:.62rem;padding:3px;border:1px solid #999;background:#fff;color:#666;border-radius:3px;cursor:pointer">Ninguno</button>
    </div>
    <h4 style="font-size:.72rem;color:#003366;margin:10px 0 4px 0;border-top:1px solid #eee;padding-top:8px">Clase de camino</h4>
    <div class="filt-row">
      <span class="filt-chip" data-f="clase" data-v="DE TIERRA" style="background:#a07842;color:#fff;border-color:#a07842">Tierra</span>
      <span class="filt-chip" data-f="clase" data-v="PAVIMENTADO" style="background:#3a7bd5;color:#fff;border-color:#3a7bd5">Pav.</span>
      <span class="filt-chip" data-f="clase" data-v="MIXTO" style="background:#7050b0;color:#fff;border-color:#7050b0">Mixto</span>
      <span class="filt-chip" data-f="clase" data-v="SIN ABRIR" style="background:#888;color:#fff;border-color:#888">S/abrir</span>

    <h4 style="font-size:.72rem;color:#003366;margin:10px 0 4px 0;border-top:1px solid #eee;padding-top:8px">Mapa</h4>
    <label style="display:flex;align-items:center;gap:5px;font-size:.68rem;cursor:pointer">
      <input type="checkbox" id="ck-poligonos" checked> Mostrar límites de partidos
    </label>
    <label style="display:flex;align-items:center;gap:5px;font-size:.68rem;cursor:pointer;margin-top:3px">
      <input type="checkbox" id="ck-progresivas" checked> Progresivas (km) al seleccionar
    </label>
    <div style="display:flex;align-items:center;gap:5px;font-size:.66rem;margin-top:3px;padding-left:18px">
      <span>cada</span>
      <select id="sl-prog-paso" style="font-size:.66rem;padding:1px 3px;border:1px solid #ccc;border-radius:3px">
        <option value="1">1 km</option>
        <option value="5" selected>5 km</option>
        <option value="10">10 km</option>
      </select>
    </div>
    <div class="resumen" id="resumen-partido"></div>
  </div>
</div>

<!-- Botón tabla -->
<div class="chip" id="btn-tabla" onclick="togglePanel('pnl-tabla')">🗒 Tabla <span class="arrow">▾</span></div>
<div class="ctrl" id="pnl-tabla">
  <div class="th">
    <span>Caminos <span id="ct-count" style="font-weight:400;opacity:.8"></span></span>
  </div>
  <div id="lista-caminos"></div>
</div>

<!-- Panel selección (sólo si hay) -->
<div class="ctrl" id="pnl-sel">
  <h4>🎯 Selección</h4>
  <div class="resumen" id="sel-resumen"></div>
  <div class="acciones">
    <button class="btn btn-clear" onclick="limpiarSeleccion()">✕ Limpiar</button>
    <button class="btn btn-csv" onclick="exportarCSV(true)">⤓ CSV selección</button>
    <button class="btn btn-rep" onclick="generarReporte(true)">📊 Reporte</button>
  </div>
</div>

<!-- Leyenda -->
<div class="ctrl" id="pnl-leyenda">
  <h4>Leyenda</h4>
  <div class="lg-item"><span class="lg-line" style="background:#a07842"></span>Tierra</div>
  <div class="lg-item"><span class="lg-line" style="background:#3a7bd5"></span>Pavimentado</div>
  <div class="lg-item"><span class="lg-line" style="background:#888"></span>Sin abrir</div>
  <div class="lg-item"><span class="lg-line" style="background:#ff6600;height:5px"></span>Seleccionado</div>
</div>

<div id="estado-fuentes" class="ctrl"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PARTIDOS = {
  '034':'General Alvear','041':'General Las Heras','058':'Las Flores',
  '062':'Lobos','075':'Navarro','091':'Roque Pérez',
  '093':'Saladillo','109':'Veinticinco de Mayo'
};
// Solo un patrón estable. Los partidos pendientes (sin archivo propio) se
// resuelven por fallback al dataset general más abajo, en cargarDatos().
const PATRONES = [
  'geojson_procesados/red_secundaria/caminos_secundarios_{cod}_final.geojson'
];

let DATA=null, CAPA=null;
let PARTIDO_FILTRO = new Set();   // vacío = todos los partidos
let CLASE_FILTROS = new Set(['DE TIERRA','PAVIMENTADO','MIXTO','SIN ABRIR']); // todos activos por defecto
const SELECCION = new Set();
const LAYERS_BY_NM = {};
const LAYERS_BY_FID = {};
const HALO_BY_FID = {};
const FEAT_BY_FID = {};
const FUENTES = {};
let CAPA_HALO = null;
let CAPA_PROG = null;          // capa de markers de progresivas
let PROG_ACTIVO = true;
let PROG_PASO_KM = 5;          // 1, 5, 10
let PROG_HOVER_NM = null;      // NOMEMCLATURA cuyas progresivas están activas por hover
let PROG_COORDS_CACHE = {};    // {nm: coords concatenadas} para no recalcular en cada mousemove
let PROG_CUMM_CACHE   = {};    // {nm: array de km acumulado por vértice}
let HOVER_TOOLTIP = null;      // L.tooltip flotante con el km del punto más cercano

const COLOR_CLASE = cl => cl==='PAVIMENTADO'?'#3a7bd5':cl==='SIN ABRIR'?'#888':cl==='MIXTO'?'#7050b0':'#a07842';
const ESTILO_BASE = cl => ({color: COLOR_CLASE(cl), weight:3, opacity:.9});
const ESTILO_HALO = cl => ({color: COLOR_CLASE(cl), weight:11, opacity:.22, lineCap:'round', lineJoin:'round'});
const ESTILO_HALO_SEL = {color:'#ff6600', weight:14, opacity:.30, lineCap:'round', lineJoin:'round'};
const ESTILO_SEL  = {color:'#ff6600', weight:6, opacity:1};
const ESTILO_DIM  = cl => ({...ESTILO_BASE(cl), opacity:.12});
const ESTILO_HIDE = {opacity:0, weight:0};

const map = L.map('map', { zoomControl: false }).setView([-35.50, -59.78], 9);
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap', maxZoom:18}).addTo(map);

// Cargar polígonos de partidos (capa siempre visible para contexto)
let LY_PARTIDOS = null;
fetch('datos/partidos_zona_vi.geojson', {cache:'no-cache'})
  .then(r => r.ok ? r.json() : null)
  .then(gj => {
    if (!gj) return;
    LY_PARTIDOS = L.geoJSON(gj, {
      style: f => ({
        color: '#003366', weight: 1.2, opacity: .55,
        fillColor: '#003366', fillOpacity: .04,
        dashArray: '3,3'
      }),
      interactive: false  // que no robe clicks a los caminos
    }).addTo(map);
    LY_PARTIDOS.bringToBack();
  })
  .catch(() => {});

// Click fuera de tramos: limpia selección
map.on('click', () => { if (SELECCION.size > 0) limpiarSeleccion(); });

// ── Toggle paneles plegables ──────────────────────────────────────
function togglePanel(id){
  const el = document.getElementById(id);
  const open = el.classList.toggle('open');
  if (id === 'pnl-partido') document.getElementById('chip-partido').classList.toggle('activo', open);
}

function normalizarClase(c){
  if (!c) return 'DE TIERRA';
  const s = c.toString().trim().toUpperCase().replace(/\s+/g, ' ');
  // Tierra: acepta variantes con 1, 2, 3+ R y "TIERRA" suelto
  if (/^DE\s+TIERR+A$/.test(s) || s === 'TIERRA') return 'DE TIERRA';
  // Pavimentado: acepta abreviaciones
  if (/^PAV(IMENTAD[OA])?\.?$/.test(s)) return 'PAVIMENTADO';
  if (/^MIXT[OA]$/.test(s)) return 'MIXTO';
  // Sin abrir
  if (/^SIN\s+ABR(IR)?$/.test(s) || s === 'S/ABRIR' || s === 'S/A') return 'SIN ABRIR';
  return s;
}

function normalizarFeature(f, codPartido, nombrePartido){
  const p = f.properties = f.properties || {};
  if (p.NOMENCLATURA && !p.NOMEMCLATURA) p.NOMEMCLATURA = p.NOMENCLATURA;
  const pInt = parseInt(p.PARTIDO);
  p.PARTIDO = !isNaN(pInt) ? pInt : parseInt(codPartido);
  if (!p.PARTIDO_NOMBRE || p.PARTIDO_NOMBRE === 'Desconocido' || p.PARTIDO_NOMBRE === '') {
    p.PARTIDO_NOMBRE = nombrePartido;
  }
  let nm = (p.NOMEMCLATURA || '').toString().trim();
  if (!nm) {
    const denom = (p.DENOMINACION || '').toString().trim();
    nm = denom ? '⚪ ' + denom : '⚪ s/código';
  }
  p.NOMEMCLATURA = nm;
  // Normalizar CLASE (corrige typos como "DE TIERRRA")
  p.CLASE = normalizarClase(p.CLASE);
  return f;
}

async function cargarDatos(){
  const features = []; const pendientes = [];
  for (const [cod, nombre] of Object.entries(PARTIDOS)){
    let ok = false;
    for (const pat of PATRONES){
      try {
        const r = await fetch(pat.replace('{cod}', cod), {cache:'no-cache'});
        if (!r.ok) continue;
        const gj = await r.json();
        if (!gj.features || !gj.features.length) continue;
        gj.features.forEach(f => { normalizarFeature(f, cod, nombre); f.properties._fuente='partido'; features.push(f); });
        FUENTES[cod]='partido'; ok=true;
        break;
      } catch(e){}
    }
    if (!ok) pendientes.push(cod);
  }
  if (pendientes.length){
    try{
      const r = await fetch('datos/zona_vi/red_secundaria_zonaVI_final.geojson', {cache:'no-cache'});
      if (r.ok){
        const gj = await r.json();
        const set = new Set(pendientes);
        gj.features.forEach(f => {
          const codInt = parseInt(f.properties.PARTIDO);
          const cod = String(codInt).padStart(3,'0');
          if (set.has(cod)){ normalizarFeature(f, cod, PARTIDOS[cod]); f.properties._fuente='fallback'; features.push(f); }
        });
        pendientes.forEach(c => { if (!FUENTES[c]) FUENTES[c]='fallback'; });
      }
    } catch(e){}
  }
  // Orden estable por (PARTIDO, NOMEMCLATURA, TRAMO_NUM). Si un feature no
  // tiene TRAMO_NUM, va al final del grupo (TRAMO_NUM=999). Esto asegura que
  // el tramo 1 aparezca antes que el tramo 2 dentro de un mismo NOMEMCLATURA.
  features.sort((a, b) => {
    const pa = (a.properties.PARTIDO || '').toString();
    const pb = (b.properties.PARTIDO || '').toString();
    if (pa !== pb) return pa.localeCompare(pb);
    const na = a.properties.NOMEMCLATURA || '';
    const nb = b.properties.NOMEMCLATURA || '';
    if (na !== nb) return na.localeCompare(nb);
    const ta = Number(a.properties.TRAMO_NUM);
    const tb = Number(b.properties.TRAMO_NUM);
    return (isNaN(ta) ? 999 : ta) - (isNaN(tb) ? 999 : tb);
  });

  const seq = {};
  features.forEach(f => {
    const nm = f.properties.NOMEMCLATURA;
    seq[nm] = (seq[nm]||0) + 1;
    f.properties._fid = nm + '#' + seq[nm];
  });
  DATA = { type:'FeatureCollection', features };
  return features.length;
}

function visible(f){
  const p = f.properties;
  // Si PARTIDO_FILTRO está vacío, asumir que ningún partido está visible.
  // Por defecto cargarDatos lo llena con TODOS los partidos presentes.
  if (!PARTIDO_FILTRO.has(p.PARTIDO_NOMBRE)) return false;
  if (!CLASE_FILTROS.has(p.CLASE || 'DE TIERRA')) return false;
  return true;
}

// ── Cálculo geodésico (haversine) ────────────────────────────────────────────
function haversineMeters(lon1, lat1, lon2, lat2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

// Obtiene array unificado de coords [lon,lat] de un feature (LineString o MultiLineString)
function coordsDeFeature(f){
  const g = f.geometry;
  if (!g) return [];
  if (g.type === 'LineString') return g.coordinates.slice();
  if (g.type === 'MultiLineString') return g.coordinates.flat();
  return [];
}

// Concatena las coords de todos los tramos de un camino (mismo NOMEMCLATURA),
// ordenados por TRAMO_NUM (los None van al final). Si un tramo arranca en
// el sentido inverso al final del anterior, lo invierte para mantener
// continuidad de la progresiva.
function concatenarCamino(nm){
  const tramos = DATA.features
    .filter(f => f.properties.NOMEMCLATURA === nm)
    .slice()
    .sort((a,b) => {
      const ta = Number(a.properties.TRAMO_NUM);
      const tb = Number(b.properties.TRAMO_NUM);
      return (isNaN(ta)?999:ta) - (isNaN(tb)?999:tb);
    });
  if (!tramos.length) return [];
  let coords = coordsDeFeature(tramos[0]);
  for (let i = 1; i < tramos.length; i++){
    const next = coordsDeFeature(tramos[i]);
    if (!next.length) continue;
    const ultimo = coords[coords.length-1];
    // Distancias del último punto al inicio y al fin del siguiente tramo
    const dIni = haversineMeters(ultimo[0], ultimo[1], next[0][0], next[0][1]);
    const dFin = haversineMeters(ultimo[0], ultimo[1], next[next.length-1][0], next[next.length-1][1]);
    // Si está más cerca el fin del siguiente, lo invierto antes de pegar
    if (dFin < dIni) next.reverse();
    coords = coords.concat(next.slice(1));  // sin duplicar el punto de empalme
  }
  return coords;
}

// Interpola puntos cada `pasoKm` desde km 0 a lo largo de la polilínea coords.
// Devuelve [{km, lon, lat}, ...] incluyendo km 0 al inicio.
function progresivas(coords, pasoKm){
  if (!coords || coords.length < 2 || !pasoKm || pasoKm <= 0) return [];
  const pasoM = pasoKm * 1000;
  const out = [{ km: 0, lon: coords[0][0], lat: coords[0][1] }];
  let acumM = 0;
  let proxM = pasoM;
  for (let i = 1; i < coords.length; i++){
    const a = coords[i-1], b = coords[i];
    const segM = haversineMeters(a[0], a[1], b[0], b[1]);
    if (segM === 0) continue;
    while (acumM + segM >= proxM){
      const t = (proxM - acumM) / segM;
      const lon = a[0] + t * (b[0] - a[0]);
      const lat = a[1] + t * (b[1] - a[1]);
      out.push({ km: Math.round(proxM / 1000), lon, lat });
      proxM += pasoM;
    }
    acumM += segM;
  }
  return out;
}

// Limpia la capa de progresivas
function limpiarProgresivas(){
  if (CAPA_PROG){ map.removeLayer(CAPA_PROG); CAPA_PROG = null; }
}

// Cache de coords concatenadas + km acumulado por vértice (para hover en vivo)
function obtenerCoordsCache(nm){
  if (PROG_COORDS_CACHE[nm]) return { coords: PROG_COORDS_CACHE[nm], cumm: PROG_CUMM_CACHE[nm] };
  const coords = concatenarCamino(nm);
  const cumm = [0];
  for (let i = 1; i < coords.length; i++){
    cumm.push(cumm[i-1] + haversineMeters(coords[i-1][0], coords[i-1][1], coords[i][0], coords[i][1]));
  }
  PROG_COORDS_CACHE[nm] = coords;
  PROG_CUMM_CACHE[nm]   = cumm;
  return { coords, cumm };
}

// Devuelve el km del punto sobre el camino más cercano al latlng del cursor.
// Usa proyección lineal sobre cada segmento, suficiente para distancias cortas.
function kmCercanoCursor(nm, latlng){
  const { coords, cumm } = obtenerCoordsCache(nm);
  if (coords.length < 2) return null;
  const px = latlng.lng, py = latlng.lat;
  let mejorKm = 0, mejorDist2 = Infinity;
  for (let i = 1; i < coords.length; i++){
    const ax = coords[i-1][0], ay = coords[i-1][1];
    const bx = coords[i][0],   by = coords[i][1];
    const dx = bx - ax,        dy = by - ay;
    const segLen2 = dx*dx + dy*dy;
    let t = segLen2 > 0 ? ((px - ax)*dx + (py - ay)*dy) / segLen2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t*dx, cy = ay + t*dy;
    const dd = (px-cx)*(px-cx) + (py-cy)*(py-cy);
    if (dd < mejorDist2){
      mejorDist2 = dd;
      const segM = haversineMeters(ax, ay, bx, by);
      const acumM = cumm[i-1] + t * segM;
      mejorKm = acumM / 1000;
    }
  }
  return mejorKm;
}

// Muestra las progresivas de un camino por hover (sin tocar selección)
function mostrarProgresivasHover(nm){
  if (!PROG_ACTIVO) return;
  if (PROG_HOVER_NM === nm) return;       // ya están las correctas
  if (SELECCION.size > 0) return;          // si hay selección activa, no interferir
  PROG_HOVER_NM = nm;
  limpiarProgresivas();
  const { coords } = obtenerCoordsCache(nm);
  if (coords.length < 2) return;
  const puntos = progresivas(coords, PROG_PASO_KM);
  if (!puntos.length) return;

  CAPA_PROG = L.layerGroup();
  puntos.forEach(pt => {
    const esMul10 = pt.km % 10 === 0;
    const esMul5  = pt.km % 5  === 0;
    const radio   = esMul10 ? 5 : (esMul5 ? 4 : 3);
    const fill    = pt.km === 0 ? '#ff6600' : '#003366';
    L.circleMarker([pt.lat, pt.lon], {
      radius: radio, color: '#fff', weight: 1.5,
      fillColor: fill, fillOpacity: 1, pane: 'markerPane'
    }).addTo(CAPA_PROG);
    const mostrarTxt = (PROG_PASO_KM <= 1) ? (pt.km % 5 === 0) : true;
    if (mostrarTxt){
      const lbl = L.divIcon({
        className: 'prog-lbl',
        html: `<div style="font-size:.62rem;color:#fff;background:rgba(0,51,102,.85);padding:1px 4px;border-radius:3px;font-weight:600;white-space:nowrap;transform:translate(8px,-50%)">km ${pt.km}</div>`,
        iconSize: [0, 0], iconAnchor: [0, 0]
      });
      L.marker([pt.lat, pt.lon], { icon: lbl, interactive: false }).addTo(CAPA_PROG);
    }
  });
  CAPA_PROG.addTo(map);
}

function ocultarProgresivasHover(){
  if (SELECCION.size > 0) return;  // si hay selección, las maneja actualizarProgresivas
  PROG_HOVER_NM = null;
  limpiarProgresivas();
  if (HOVER_TOOLTIP){ map.closeTooltip(HOVER_TOOLTIP); HOVER_TOOLTIP = null; }
}

function actualizarTooltipKm(nm, latlng){
  if (!PROG_ACTIVO) return;
  const km = kmCercanoCursor(nm, latlng);
  if (km === null) return;
  const html = `<div style="font-size:.7rem;font-weight:700;color:#003366">${nm} · km ${km.toFixed(2)}</div>`;
  if (!HOVER_TOOLTIP){
    HOVER_TOOLTIP = L.tooltip({
      permanent: true, sticky: true, direction: 'top',
      offset: [0, -10], className: 'prog-hover-tip'
    });
  }
  HOVER_TOOLTIP.setLatLng(latlng).setContent(html);
  if (!HOVER_TOOLTIP._map) HOVER_TOOLTIP.addTo(map);
}

// Si hay un camino seleccionado y progresivas activadas, las dibuja
function actualizarProgresivas(){
  limpiarProgresivas();
  if (!PROG_ACTIVO || SELECCION.size === 0) return;
  // Obtener el NOMEMCLATURA del primer seleccionado (todos deberían ser del mismo)
  const fid = [...SELECCION][0];
  const f = FEAT_BY_FID[fid];
  if (!f) return;
  const nm = f.properties.NOMEMCLATURA;
  const coords = concatenarCamino(nm);
  if (coords.length < 2) return;
  const puntos = progresivas(coords, PROG_PASO_KM);
  if (!puntos.length) return;

  CAPA_PROG = L.layerGroup();
  puntos.forEach(pt => {
    const esMultiplo10 = pt.km % 10 === 0;
    const esMultiplo5  = pt.km % 5 === 0;
    const radio = esMultiplo10 ? 5 : (esMultiplo5 ? 4 : 3);
    const colorFill = pt.km === 0 ? '#ff6600' : '#003366';
    const marker = L.circleMarker([pt.lat, pt.lon], {
      radius: radio,
      color: '#fff', weight: 1.5,
      fillColor: colorFill, fillOpacity: 1,
      pane: 'markerPane'
    });
    // Etiqueta al lado del marker para km 0, 5, 10, 20, ... (no en cada km si paso=1)
    const mostrarTexto = (PROG_PASO_KM <= 1) ? (pt.km % 5 === 0) : true;
    if (mostrarTexto){
      const lbl = L.divIcon({
        className: 'prog-lbl',
        html: `<div style="font-size:.62rem;color:#fff;background:rgba(0,51,102,.85);padding:1px 4px;border-radius:3px;font-weight:600;white-space:nowrap;transform:translate(8px,-50%)">km ${pt.km}</div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      });
      L.marker([pt.lat, pt.lon], { icon: lbl, interactive: false }).addTo(CAPA_PROG);
    }
    marker.addTo(CAPA_PROG);
  });
  CAPA_PROG.addTo(map);
}

function renderMapa(){
  // Capa de HALO (sombreado más ancho y suave) — se dibuja PRIMERO para que quede debajo
  CAPA_HALO = L.geoJSON(DATA, {
    style: f => visible(f) ? ESTILO_HALO(f.properties.CLASE) : ESTILO_HIDE,
    interactive: false,  // los clicks van a la capa principal
    onEachFeature: (f, layer) => {
      HALO_BY_FID[f.properties._fid] = layer;
    }
  }).addTo(map);

  // Capa principal — colores saturados, click + hover + popup
  CAPA = L.geoJSON(DATA, {
    style: f => visible(f) ? ESTILO_BASE(f.properties.CLASE) : ESTILO_HIDE,
    onEachFeature: (f, layer) => {
      const nm = f.properties.NOMEMCLATURA;
      const fid = f.properties._fid;
      if (!LAYERS_BY_NM[nm]) LAYERS_BY_NM[nm] = [];
      LAYERS_BY_NM[nm].push(layer);
      LAYERS_BY_FID[fid] = layer;
      FEAT_BY_FID[fid] = f;
      layer.on('click', e => { abrirPopup(fid, e); L.DomEvent.stopPropagation(e); });
      layer.on('mouseover', e => {
        if (!visible(f)) return;
        if (!SELECCION.has(fid)) layer.setStyle({weight:5});
        // Mostrar progresivas del camino completo + tooltip de km al hover
        mostrarProgresivasHover(f.properties.NOMEMCLATURA);
        actualizarTooltipKm(f.properties.NOMEMCLATURA, e.latlng);
      });
      layer.on('mousemove', e => {
        if (!visible(f)) return;
        if (!PROG_ACTIVO) return;
        actualizarTooltipKm(f.properties.NOMEMCLATURA, e.latlng);
      });
      layer.on('mouseout', () => {
        if (!visible(f)) { layer.setStyle(ESTILO_HIDE); return; }
        if (!SELECCION.has(fid)) layer.setStyle(ESTILO_BASE(f.properties.CLASE));
        ocultarProgresivasHover();
      });
    }
  }).addTo(map);
  map.fitBounds(CAPA.getBounds().pad(0.05));
}

function aplicarFiltrosAlMapa(){
  DATA.features.forEach(f => {
    const fid = f.properties._fid;
    const l  = LAYERS_BY_FID[fid];
    const h  = HALO_BY_FID[fid];
    if (!l) return;
    const sel = SELECCION.has(fid);
    if (sel) {
      l.setStyle(ESTILO_SEL); l.bringToFront();
      if (h) h.setStyle(ESTILO_HALO_SEL);
    } else if (visible(f)) {
      l.setStyle(ESTILO_BASE(f.properties.CLASE));
      if (h) h.setStyle(ESTILO_HALO(f.properties.CLASE));
    } else {
      l.setStyle(ESTILO_HIDE);
      if (h) h.setStyle(ESTILO_HIDE);
    }
  });
  actualizarProgresivas();
}

function poblarSelector(){
  const cont = document.getElementById('cks-partidos');
  cont.innerHTML = '';
  const presentes = new Map();
  DATA.features.forEach(f => {
    const nombre = f.properties.PARTIDO_NOMBRE;
    if (!presentes.has(nombre)){
      const cod = Object.entries(PARTIDOS).find(([c,n]) => n === nombre)?.[0] || '';
      presentes.set(nombre, cod);
    }
  });
  // Default: TODOS los partidos seleccionados al inicio
  PARTIDO_FILTRO = new Set(presentes.keys());
  [...presentes.entries()].sort(([a],[b]) => a.localeCompare(b)).forEach(([nombre, cod]) => {
    const ok = FUENTES[cod] === 'partido';
    const id = 'ck-p-' + cod;
    const label = document.createElement('label');
    label.className = 'ck-chip on';
    label.innerHTML = `<input type="checkbox" id="${id}" data-nombre="${nombre}" checked> <span>${ok?'✓':'◌'} ${nombre}</span>`;
    cont.appendChild(label);
    const input = label.querySelector('input');
    input.addEventListener('change', e => {
      label.classList.toggle('on', e.target.checked);
      togglePartido(nombre, e.target.checked);
    });
  });
  actualizarChipPartido();
}

function togglePartido(nombre, on){
  if (on) PARTIDO_FILTRO.add(nombre);
  else PARTIDO_FILTRO.delete(nombre);
  actualizarChipPartido();
  aplicarFiltrosAlMapa();
  renderTabla();
  // Zoom a los visibles
  const visibles = DATA.features.filter(visible).map(f => LAYERS_BY_FID[f.properties._fid]).filter(Boolean);
  if (visibles.length && PARTIDO_FILTRO.size > 0){
    const b = L.featureGroup(visibles).getBounds();
    if (b.isValid()) map.fitBounds(b.pad(0.1));
  } else if (PARTIDO_FILTRO.size === 0){
    map.fitBounds(CAPA.getBounds().pad(0.05));
  }
  renderResumenSelMulti();
}

function setTodosPartidos(on){
  document.querySelectorAll('#cks-partidos label.ck-chip').forEach(label => {
    const ck = label.querySelector('input');
    ck.checked = on;
    label.classList.toggle('on', on);
    const nombre = ck.dataset.nombre;
    if (on) PARTIDO_FILTRO.add(nombre); else PARTIDO_FILTRO.delete(nombre);
  });
  actualizarChipPartido();
  aplicarFiltrosAlMapa();
  renderTabla();
  if (on){
    const layers = DATA.features.filter(visible).map(f => LAYERS_BY_FID[f.properties._fid]).filter(Boolean);

  } else {
    map.fitBounds(CAPA.getBounds().pad(0.05));
  }

}

function claseTag(cl){
  if (cl === 'PAVIMENTADO') return '<span class="tklass k-pavi">PAV</span>';
  if (cl === 'MIXTO')       return '<span class="tklass k-mixto" style="background:#7050b0;color:#fff;padding:1px 4px;border-radius:2px">MIX</span>';
  if (cl === 'SIN ABRIR') return '<span class="tklass k-sinabrir">S/A</span>';
  return '<span class="tklass k-tierra">TIE</span>';
}

// Calcula la dirección cardinal del tramo desde (latI,lonI) hasta (latF,lonF).
// En Argentina las longitudes son negativas — comparamos directamente:
//   dLat > 0  → vamos hacia el Norte ; dLat < 0  → hacia el Sur
//   dLon > 0  → vamos hacia el Este  ; dLon < 0  → hacia el Oeste
// Si una componente domina (>2.5x la otra), devolvemos solo esa dirección;
// si son comparables, devolvemos la diagonal (NE, SO, NO, SE).
function direccionCardinal(latI, lonI, latF, lonF){
  const dLat = Number(latF) - Number(latI);
  const dLon = Number(lonF) - Number(lonI);
  const aLat = Math.abs(dLat), aLon = Math.abs(dLon);
  if (aLat < 1e-6 && aLon < 1e-6) return '—';
  const ns = dLat > 0 ? 'Norte' : 'Sur';
  const eo = dLon > 0 ? 'Este'  : 'Oeste';
  const desdeNS = dLat > 0 ? 'Sur'  : 'Norte';
  const desdeEO = dLon > 0 ? 'Oeste': 'Este';
  if (aLat > 2.5 * aLon) return desdeNS + ' → ' + ns;   // tramo casi N-S
  if (aLon > 2.5 * aLat) return desdeEO + ' → ' + eo;   // tramo casi E-O
  // Diagonal: combinamos las dos componentes (ej: "SO → NE")
  const ini = (dLat > 0 ? 'S' : 'N') + (dLon > 0 ? 'O' : 'E');
  const fin = (dLat > 0 ? 'N' : 'S') + (dLon > 0 ? 'E' : 'O');
  return ini + ' → ' + fin;
}

function renderTabla(){
  const lista = document.getElementById('lista-caminos');
  const items = DATA.features.filter(visible);
  const grupos = {};
  items.forEach(f => { const nm = f.properties.NOMEMCLATURA; (grupos[nm] = grupos[nm] || []).push(f); });
  document.getElementById('ct-count').textContent = '('+Object.keys(grupos).length+' caminos / '+items.length+' tramos)';
  const ord = Object.entries(grupos).sort(([a],[b]) => a.localeCompare(b));
  lista.innerHTML = ord.map(([nm, fs]) => {
    const km = fs.reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
    const dn = fs[0].properties.DENOMINACION || '—';
    const claseKm = {};
    fs.forEach(f => { const c = f.properties.CLASE || 'DE TIERRA'; claseKm[c] = (claseKm[c]||0) + (f.properties.LONGITUD_KM_WGS84||0); });
    const claseDom = Object.entries(claseKm).sort(([,a],[,b]) => b-a)[0][0];
    const ic = claseDom === 'PAVIMENTADO' ? '🛣' : claseDom === 'SIN ABRIR' ? '⚠' : '🌾';
    const rv = fs.some(f => f.properties.ALERTA === 'REVISAR') ? ' ⚠' : '';
    const nTramos = fs.length;
    let html = '<div class="row" data-nm="'+nm+'"><div class="nm">'+ic+' '+nm+rv+'<span class="km">'+km.toFixed(2)+' km</span></div><div class="dn">'+dn+'</div>';
    if (nTramos > 1) html += '<div class="dn" style="color:#888;font-size:.6rem">'+nTramos+' tramos ↓</div>';
    html += '</div>';
    if (nTramos > 1){
      html += '<div class="tramos">';
      fs.forEach((f, i) => {
        const p = f.properties;
        const tkm = (p.LONGITUD_KM_WGS84||0).toFixed(2);
        // "Tramo N" solo tiene sentido cuando el camino tiene >1 tramos.
        // Si es uno solo, mostramos solo la clase (ej "PAVIMENTADO 12.5 km").
        // Cuando hay TRAMO_NUM en el dato, lo usamos como número real
        // (respeta tu orden topológico); sino caemos al índice del array.
        const numT = (p.TRAMO_NUM != null && p.TRAMO_NUM !== '') ? p.TRAMO_NUM : (i+1);
        const etiqueta = (fs.length > 1) ? ('Tramo '+numT) : '';
        html += '<div class="tramo" data-fid="'+p._fid+'">'+
                  '<div>'+claseTag(p.CLASE||'')+(etiqueta?' '+etiqueta:'')+'</div>'+
                  '<span style="color:#003366;font-weight:600">'+tkm+' km</span>'+
                '</div>';
      });
      html += '</div>';
    }
    return html;
  }).join('');
  lista.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => seleccionarCamino(r.dataset.nm)));
  lista.querySelectorAll('.tramo').forEach(t => t.addEventListener('click', e => { e.stopPropagation(); toggleTramo(t.dataset.fid); }));
}

// ── Popup en tramo (al click en mapa) ─────────────────────────────
function abrirPopup(fid, e){
  const f = FEAT_BY_FID[fid];
  if (!f) return;
  const p = f.properties;
  const yaSel = SELECCION.has(fid);
  const totalT = (LAYERS_BY_NM[p.NOMEMCLATURA] || []).length;
  const html =
    '<div class="pop-tit">'+p.NOMEMCLATURA + (totalT>1 ? ' · t'+(p._fid.split("#")[1]||'?')+'/'+totalT : '') + '</div>'+
    '<div class="pop-dn">'+(p.DENOMINACION||'—')+'</div>'+
    '<div class="pop-row"><span class="pop-lbl">Partido</span><span class="pop-val">'+p.PARTIDO_NOMBRE+' ('+p.PARTIDO+')</span></div>'+
    '<div class="pop-row"><span class="pop-lbl">Clase</span><span class="pop-val">'+(p.CLASE||'—')+'</span></div>'+
    '<div class="pop-row"><span class="pop-lbl">Transit.</span><span class="pop-val">'+(p.TRANSITABIlIDAD||'—')+'</span></div>'+
    '<div class="pop-row"><span class="pop-lbl">Long. WGS84</span><span class="pop-val">'+(p.LONGITUD_KM_WGS84||0).toFixed(3)+' km</span></div>'+
    '<div class="pop-row"><span class="pop-lbl">Long. orig.</span><span class="pop-val">'+(p.LONGITUD_KM_ORIG||0).toFixed(3)+' km</span></div>'+
    '<div class="pop-row"><span class="pop-lbl">Diff %</span><span class="pop-val">'+(p.DIFF_PCT||0).toFixed(2)+' %</span></div>'+
    (totalT > 1 && p.TRAMO_NUM != null && p.TRAMO_NUM !== '' ?
       '<div class="pop-row"><span class="pop-lbl">Tramo n°</span><span class="pop-val">'+p.TRAMO_NUM+' de '+totalT+'</span></div>' : '')+
    (p.LAT_INI != null && p.LON_INI != null && p.LAT_FIN != null && p.LON_FIN != null ?
       '<div class="pop-row"><span class="pop-lbl">Sentido</span><span class="pop-val">'+
         direccionCardinal(p.LAT_INI, p.LON_INI, p.LAT_FIN, p.LON_FIN)+
       '</span></div>' : '')+
    (p.ALERTA==='REVISAR' ? '<div class="alerta">⚠ Diff > 10% — revisar geometría</div>' : '')+
    '<button class="pop-action '+(yaSel?'quitar':'')+'" onclick="toggleTramo(\''+fid+'\'); map.closePopup()">'+
      (yaSel ? '✕ Quitar de selección' : '+ Agregar a selección')+
    '</button>';
  L.popup({maxWidth:300, autoPan:true})
    .setLatLng(e.latlng)
    .setContent(html)
    .openOn(map);
}

// ── Selección por toggle ──────────────────────────────────────────
function toggleTramo(fid){
  if (SELECCION.has(fid)) SELECCION.delete(fid);
  else SELECCION.add(fid);
  aplicarSeleccion();
}

function seleccionarCamino(nm){
  SELECCION.clear();
  (LAYERS_BY_NM[nm] || []).forEach(l => {
    const fid = Object.entries(LAYERS_BY_FID).find(([k,v]) => v === l)?.[0];
    if (fid) SELECCION.add(fid);
  });
  aplicarSeleccion(true);
}

function limpiarSeleccion(reaplicar = true){
  SELECCION.clear();
  if (reaplicar) aplicarSeleccion();
}

function aplicarSeleccion(zoomA = false){
  aplicarFiltrosAlMapa();
  // Tabla
  document.querySelectorAll('.tramo').forEach(t => t.classList.toggle('sel', SELECCION.has(t.dataset.fid)));
  document.querySelectorAll('.row[data-nm]').forEach(r => {
    const nm = r.dataset.nm;
    const total = (LAYERS_BY_NM[nm] || []).length;
    const sel = DATA.features.filter(f => f.properties.NOMEMCLATURA === nm && SELECCION.has(f.properties._fid)).length;
    r.classList.toggle('activo-camino', total > 0 && sel === total);
  });
  // Panel selección
  const pnl = document.getElementById('pnl-sel');
  if (SELECCION.size === 0){ pnl.classList.remove('activo'); return; }
  pnl.classList.add('activo');
  if (zoomA){
    const layers = [...SELECCION].map(f => LAYERS_BY_FID[f]).filter(Boolean);
    if (layers.length){ const b = L.featureGroup(layers).getBounds(); if (b.isValid()) map.fitBounds(b.pad(0.25)); }
  }
  renderResumenSel();
}

function renderResumenSel(){
  const feats = [...SELECCION].map(f => FEAT_BY_FID[f]).filter(Boolean);
  const km = feats.reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
  const km_t = feats.filter(f => f.properties.CLASE === 'DE TIERRA').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
  const km_p = feats.filter(f => f.properties.CLASE === 'PAVIMENTADO').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
  const km_s = feats.filter(f => f.properties.CLASE === 'SIN ABRIR').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
  const nms = new Set(feats.map(f => f.properties.NOMEMCLATURA));
  const ps = new Set(feats.map(f => f.properties.PARTIDO_NOMBRE));
  document.getElementById('sel-resumen').innerHTML =
    '<div><b>'+feats.length+'</b> tramos / <b>'+nms.size+'</b> caminos / <b>'+ps.size+'</b> partido'+(ps.size!==1?'s':'')+'</div>'+
    '<div class="km-grande">'+km.toFixed(2)+' km</div>'+
    '<div style="margin-top:3px">'+
      (km_t>0?'<span class="badge badge-tierra">'+km_t.toFixed(1)+' tierra</span>':'')+
      (km_p>0?'<span class="badge badge-pavi">'+km_p.toFixed(1)+' pav.</span>':'')+
      (km_s>0?'<span class="badge badge-sinabrir">'+km_s.toFixed(1)+' s/abr</span>':'')+
    '</div>';
}

// ── Exportar CSV ──────────────────────────────────────────────────
function exportarCSV(soloSeleccion){
  const feats = soloSeleccion
    ? [...SELECCION].map(f => FEAT_BY_FID[f]).filter(Boolean)
    : DATA.features.filter(visible);
  if (!feats.length){ alert('No hay tramos en el conjunto a exportar.'); return; }
  const cols = ['NOMEMCLATURA','PARTIDO','PARTIDO_NOMBRE','DENOMINACION','CLASE','TRANSITABIlIDAD','TIPO','LONGITUD_KM_ORIG','LONGITUD_KM_WGS84','N_VERTICES','N_LINEAS','DIFF_PCT','ALERTA','_fuente'];
  let csv = cols.join(',') + '\n';
  feats.forEach(f => {
    const row = cols.map(c => {
      let v = f.properties[c];
      if (v == null) return '';
      v = String(v).replace(/"/g, '""');
      return v.includes(',') || v.includes('"') || v.includes('\n') ? '"'+v+'"' : v;
    });
    csv += row.join(',') + '\n';
  });
  const fecha = new Date().toISOString().substring(0,10);
  const nombre = 'caminos_secundarios_' + (soloSeleccion?'seleccion':'visible') + '_' + fecha + '.csv';
  descargar(nombre, csv, 'text/csv;charset=utf-8');
}

function descargar(nombre, contenido, mime){
  const blob = new Blob(['﻿' + contenido], {type: mime}); // BOM para Excel
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Reporte HTML imprimible ───────────────────────────────────────
function generarReporte(soloSeleccion){
  const feats = soloSeleccion
    ? [...SELECCION].map(f => FEAT_BY_FID[f]).filter(Boolean)
    : DATA.features.filter(visible);
  if (!feats.length){ alert('No hay tramos en el conjunto del reporte.'); return; }
  // Agrupar por partido
  const porPartido = {};
  feats.forEach(f => {
    const k = f.properties.PARTIDO_NOMBRE;
    if (!porPartido[k]) porPartido[k] = [];
    porPartido[k].push(f);
  });
  const km_total = feats.reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
  const fecha = new Date().toLocaleDateString('es-AR');
  const titulo = soloSeleccion ? 'Reporte de selección' : 'Reporte de caminos visibles';
  const filtros = [];
  if (PARTIDO_FILTRO) filtros.push('Partido: ' + PARTIDO_FILTRO);
  filtros.push('Clases: ' + [...CLASE_FILTROS].join(', '));

  let body = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>${titulo} — DVBA Zona VI</title>
<style>
body{font-family:Arial,sans-serif;color:#1a2a3a;max-width:900px;margin:20px auto;padding:0 20px;line-height:1.4}
h1{color:#003366;border-bottom:3px solid #003366;padding-bottom:8px;font-size:1.4rem}
h2{color:#003366;margin-top:24px;font-size:1.1rem;border-bottom:1px solid #ccc;padding-bottom:4px}
h3{color:#003366;margin-top:16px;font-size:.95rem}
.meta{font-size:.8rem;color:#666;margin:8px 0 16px 0}
.tot{background:#f0f4f8;padding:10px 14px;border-left:4px solid #003366;margin:10px 0;font-size:.85rem}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.78rem}
th{background:#003366;color:#fff !important;text-align:left;padding:5px 8px}
th.km{text-align:right;color:#fff !important}
td{padding:4px 8px;border-bottom:1px solid #e0e0e0}
tr:nth-child(even) td{background:#f7f9fc}
td.km{text-align:right;font-weight:600;color:#003366}
.alerta{color:#c00}
.firma{margin-top:40px;padding-top:20px;border-top:1px solid #ccc;font-size:.78rem;color:#666;display:flex;justify-content:space-between}
.btn-imp{display:inline-block;background:#003366;color:#fff;padding:8px 16px;border-radius:4px;text-decoration:none;font-size:.8rem;border:none;cursor:pointer}
@media print { .btn-imp,.no-print{display:none} body{margin:0;padding:0 10px} }
</style></head><body>
<div class="no-print" style="margin-bottom:10px"><button class="btn-imp" onclick="window.print()">🖨 Imprimir / Guardar PDF</button></div>
<h1>${titulo} — DVBA Zona Departamental VI Saladillo</h1>
<div class="meta">Generado: ${fecha} · Filtros aplicados: ${filtros.join(' · ')}</div>
<div class="tot"><b>${feats.length}</b> tramos / <b>${new Set(feats.map(f => f.properties.NOMEMCLATURA)).size}</b> caminos / <b>${Object.keys(porPartido).length}</b> partido${Object.keys(porPartido).length!==1?'s':''} · longitud total <b>${km_total.toFixed(3)} km</b></div>`;

  // Tabla resumen por partido
  body += '<h2>Resumen por partido</h2><table><thead><tr><th>Partido</th><th>Tramos</th><th>Caminos</th><th class="km">DE TIERRA</th><th class="km">PAVIMENTADO</th><th class="km">SIN ABRIR</th><th class="km">Total km</th></tr></thead><tbody>';
  Object.entries(porPartido).sort(([a],[b]) => a.localeCompare(b)).forEach(([nombre, fs]) => {
    const km_t = fs.filter(f => f.properties.CLASE === 'DE TIERRA').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
    const km_p = fs.filter(f => f.properties.CLASE === 'PAVIMENTADO').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
    const km_s = fs.filter(f => f.properties.CLASE === 'SIN ABRIR').reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
    const tot = km_t + km_p + km_s;
    const ncam = new Set(fs.map(f => f.properties.NOMEMCLATURA)).size;
    body += `<tr><td>${nombre}</td><td>${fs.length}</td><td>${ncam}</td><td class="km">${km_t.toFixed(2)}</td><td class="km">${km_p.toFixed(2)}</td><td class="km">${km_s.toFixed(2)}</td><td class="km">${tot.toFixed(2)}</td></tr>`;
  });
  body += '</tbody></table>';

  // Detalle por partido
  Object.entries(porPartido).sort(([a],[b]) => a.localeCompare(b)).forEach(([nombre, fs]) => {
    body += `<h2>${nombre}</h2>`;
    // agrupar por NOMEMCLATURA
    const grup = {};
    fs.forEach(f => { const k = f.properties.NOMEMCLATURA; (grup[k]=grup[k]||[]).push(f); });
    body += '<table><thead><tr><th>Código</th><th>Denominación</th><th>Clase</th><th>Transit.</th><th class="km">km (WGS84)</th></tr></thead><tbody>';
    Object.entries(grup).sort(([a],[b]) => a.localeCompare(b)).forEach(([nm, ts]) => {
      const km = ts.reduce((s,f) => s + (f.properties.LONGITUD_KM_WGS84||0), 0);
      const cls = [...new Set(ts.map(f => f.properties.CLASE||''))].join(' / ');
      const tr  = [...new Set(ts.map(f => f.properties.TRANSITABIlIDAD||''))].join(' / ');
      // Limpiar prefijo "Tramo N:" de la denominación y juntar los sufijos si hay varios tramos
      const limpiarDenom = (s) => (s || '').replace(/^\s*Tramo\s+\d+\s*:\s*/i, '').trim();
      let denom;
      if (ts.length === 1) {
        denom = limpiarDenom(ts[0].properties.DENOMINACION) || (ts[0].properties.DENOMINACION || '—');
      } else {
        // ordenar por TRAMO_NUM si existe
        const ordenados = [...ts].sort((a,b) => (a.properties.TRAMO_NUM||999) - (b.properties.TRAMO_NUM||999));
        const partes = ordenados.map(f => limpiarDenom(f.properties.DENOMINACION)).filter(x => x);
        denom = partes.length ? partes.join(' / ') : '—';
      }
      const al = ts.some(f => f.properties.ALERTA==='REVISAR') ? ' <span class="alerta">⚠</span>' : '';
      body += `<tr><td>${nm}${al}</td><td>${denom}${ts.length>1?' <em>('+ts.length+' tramos)</em>':''}</td><td>${cls}</td><td>${tr}</td><td class="km">${km.toFixed(3)}</td></tr>`;
    });
    body += '</tbody></table>';
  });

  body += `<div class="firma"><div>DVBA — División Técnica Zona VI Saladillo<br>Ing. Luciano Lamaita</div><div>Fuente: caminos secundarios provinciales<br>Longitudes geodésicas WGS84 (PROJ.4)</div></div></body></html>`;

  const w = window.open('', '_blank');
  w.document.write(body);
  w.document.close();
}

cargarDatos().then(n => {
  if (!n){ document.getElementById('stats').textContent = '⚠ Sin datos.'; return; }
  renderMapa(); poblarSelector(); renderTabla(); actualizarStats(); actualizarEstadoFuentes();
});
