<body>
<div id="hdr">

</div>

  </select>
  <hr>
  <div style="font-size:.7rem;color:#666">Clic en traza → progresiva</div>
</div>

<div class="ctrl" id="pnl-ley">
  <h4>Referencias</h4>
  <div><span class="dot" style="background:#6ab0cc"></span>Traza RP91</div>
  <div><span class="dot" style="background:#003366;border:2px solid #fff"></span>Mojón físico</div>
  <div><span class="dot" style="background:#888"></span>Mojón sintético 5km</div>
  <div style="margin-top:6px;font-size:.68rem;color:#666">
    144 pts · 51.583 km<br>
    Dirección: Aumenta en direccion SE<br>
    Sin gaps
  </div>
</div>

<div id="pnl-prog"></div>

<script src="../datos/rutas_rp91.js"></script>
<script src="../datos/rutas.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Verificar carga ──────────────────────────────────────────────────────────
(function(){
  const falta = ['CHAIN_RP91','ANCHORS_RP91','MOJONES_RP91','MOJONES_RP91_TODOS','META_RP91']
    .filter(v => typeof window[v] === 'undefined');
  if (falta.length) {
    document.getElementById('stats').textContent = '⚠ Falta: ' + falta.join(', ');
    console.error('Variables faltantes:', falta);
  }
})();

// ── Mapa ─────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([-35.81619,-59.55974], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OpenStreetMap', maxZoom:18}).addTo(map);

// ── Acumulado ────────────────────────────────────────────────────────────────
function hav(a,b){
  const R=6371,dL=(b[1]-a[1])*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
const ACUM=[0];
for(let i=1;i<CHAIN_RP91.length;i++) ACUM.push(ACUM[i-1]+hav(CHAIN_RP91[i-1],CHAIN_RP91[i]));

function calcProg(acc){
  // RP91 empieza en km0 — interpolación directa con anchors
  if(!ANCHORS_RP91.length) return acc;
  if(acc<=ANCHORS_RP91[0].acc) return acc;
  for(let i=0;i<ANCHORS_RP91.length-1;i++){
    const a=ANCHORS_RP91[i],b=ANCHORS_RP91[i+1];
    if(acc>=a.acc&&acc<=b.acc) return a.km+(acc-a.acc)/(b.acc-a.acc)*(b.km-a.km);
  }
  return acc;
}

// ── Capas ────────────────────────────────────────────────────────────────────
const lyT=L.layerGroup(), lyMF=L.layerGroup(), lyMS=L.layerGroup();

L.polyline(CHAIN_RP91.map(p=>[p[1],p[0]]),
  {color:'#6ab0cc',weight:5,opacity:.9}).addTo(lyT);

function buildMF(){
  lyMF.clearLayers();
  MOJONES_RP91.forEach(m=>{
    L.circleMarker([m.lat,m.lng],
      {radius:9,fillColor:'#003366',color:'#fff',weight:2,fillOpacity:1})
     .bindPopup(`<b>${m.km_label}</b><br>
       ${m.sentido}<br>
       <i>Tipo: ${m.tipo||'—'}</i><br>
       Fuente: ${m.fuente||'—'}<br>
       Resp: ${m.resp||'—'}<br>
       Fecha: ${m.fecha||'—'}`)
     .addTo(lyMF);
    L.marker([m.lat,m.lng],{icon:L.divIcon({
      className:'mjl',
      html:`<b>${m.km_label}</b>`,
      iconAnchor:[-6,-4]
    })}).addTo(lyMF);
  });
}

function buildMS(paso){
  lyMS.clearLayers();
  const _kmFis = new Set((MOJONES_RP91||[]).map(m=>m.km));
  MOJONES_RP91_TODOS.filter(m=>m.sintetico&&m.km%paso===0&&!_kmFis.has(m.km)).forEach(m=>{
    L.circleMarker([m.lat,m.lng],
      {radius:4,fillColor:'#6ab0cc',color:'#fff',weight:1,fillOpacity:.85})
     .bindPopup(`<b>km ${m.km}</b> (sintético)<br>Acum. local: ${m.acc_local} km`)
     .addTo(lyMS);
    if(m.km%10===0)
      L.marker([m.lat,m.lng],{icon:L.divIcon({
        className:'mjl',
        html:`<span style="color:#4488aa">${m.km}</span>`,
        iconAnchor:[-4,-3]
      })}).addTo(lyMS);
  });
}

buildMF(); buildMS(5);
[lyT,lyG,lyMS,lyMF].forEach(l=>l&&l.bringToFront&&l.bringToFront());
[lyT,lyMF,lyMS].forEach(l=>l.addTo(map));

// ── Controles ────────────────────────────────────────────────────────────────
[['c-traza',lyT],['c-mf',lyMF],['c-ms',lyMS]]
  .forEach(([id,l])=>document.getElementById(id).onchange=e=>e.target.checked?l.addTo(map):l.remove());
document.getElementById('sel-paso').onchange=e=>{
  buildMS(+e.target.value);
  if(document.getElementById('c-ms').checked) lyMS.addTo(map);
};

// ── Clic → progresiva ────────────────────────────────────────────────────────
map.on('mousemove', e=>{ _showProg(e); });

// ── Proyección CONTINUA del cursor sobre la traza (no salto entre puntos) ──
function _projOnSegment(p, a, b){
  // Proyecta el punto p sobre el segmento ab. Devuelve {pt, t, dist}
  const ax=a[0], ay=a[1], bx=b[0], by=b[1];
  const dx=bx-ax, dy=by-ay;
  const L2 = dx*dx + dy*dy;
  if (L2 < 1e-12) return {pt:[ax,ay], t:0, dist:Math.hypot(p[0]-ax, p[1]-ay)};
  let t = ((p[0]-ax)*dx + (p[1]-ay)*dy) / L2;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const px = ax + t*dx, py = ay + t*dy;
  return {pt:[px,py], t:t, dist:Math.hypot(p[0]-px, p[1]-py)};
}

function _findClosestOnChain(CHAIN, ACUM, ll){
  // Busca el segmento (i-1,i) más cercano al cursor [lng,lat]
  // y devuelve {acc, lat, lng, idx}
  const target=[ll.lng, ll.lat];
  let best={d:1e9, acc:0, lat:ll.lat, lng:ll.lng, i:0};
  for (let i=1; i<CHAIN.length; i++){
    const r = _projOnSegment(target, CHAIN[i-1], CHAIN[i]);
    if (r.dist < best.d){
      // Acumulado interpolado entre ACUM[i-1] y ACUM[i]
      const acc_seg = ACUM[i] - ACUM[i-1];
      best = {
        d: r.dist,
        acc: ACUM[i-1] + r.t * acc_seg,
        lat: r.pt[1], lng: r.pt[0],
        i: i
      };
    }
  }
  return best;
}

function _formatProgresiva(km){
  // Formato oficial: XX km + YYY m  (XX.XXX km)
  if (km < 0){
    return '-' + _formatProgresiva(-km).replace(/^-/,'');
  }
  const k = Math.floor(km);
  const m = Math.round((km - k) * 1000);
  // Manejar overflow (m=1000 → +1km)
  if (m >= 1000) {
    return (k+1).toString().padStart(2,'0') + ' km + 0 m';
  }
  return k.toString().padStart(2,'0') + ' km + ' + m.toString().padStart(3,'0') + ' m';
}


// Cursor móvil sobre la traza: proyecta y muestra progresiva continua
let _hoverMarker = null;
function _showProgEvent(e){
  const closest = _findClosestOnChain(CHAIN_RP91, ACUM, e.latlng);
  // Si el cursor está MUY lejos (>0.5 grados ~50km), no mostrar
  if (closest.d > 0.5) {
    if (_hoverMarker){ _hoverMarker.remove(); _hoverMarker = null; }
    return;
  }
  const acc = closest.acc;
  const prog = calcProg(acc);
  const g = getGap(acc);
  // Mover marker visible que sigue el cursor
  if (!_hoverMarker){
    _hoverMarker = L.circleMarker([closest.lat, closest.lng],
      {radius:7, fillColor:'#ff6600', color:'#fff', weight:2, fillOpacity:.9}).addTo(map);
  } else {
    _hoverMarker.setLatLng([closest.lat, closest.lng]);
  }
  // Panel
  const box = document.getElementById('pnl-prog');
  if (!box) return;
  box.style.display = 'block';
  box.innerHTML =
    '<b>RP 91</b> · progresiva<br>' +
    '<span style="font-size:1.4rem;font-weight:700">' + _formatProgresiva(prog) + '</span><br>' +
    '<span style="opacity:.85;font-size:.85rem">(' + prog.toFixed(3) + ' km)</span><br>' +
    '<span style="opacity:.7;font-size:.75rem">acc local: ' + acc.toFixed(3) + ' km</span>' +
    (g ? '<br><span style="color:#f99">⚠ ' + (g.label||'gap') + '</span>' : '');
}

map.on('mousemove', _showProgEvent);
map.on('click', _showProgEvent);

  const prog=calcProg(ACUM[bi]);
  document.getElementById('pnl-prog').style.display='block';
  document.getElementById('pnl-prog').innerHTML=
    `<b>RP 91</b><br>Progresiva: <b>km ${prog.toFixed(2)}</b><br>`+
    `Acum. local: ${ACUM[bi].toFixed(3)} km<br>`+
    `<span style="color:#adf;font-size:.75rem">Dirección: Aumenta en direccion SE</span>`;
});

// ── Fit y stats ──────────────────────────────────────────────────────────────
map.fitBounds(L.latLngBounds(CHAIN_RP91.map(p=>[p[1],p[0]])).pad(.08));
document.getElementById('stats').textContent=
  `${CHAIN_RP91.length} pts | ${META_RP91.longGis} km | `+
  `${META_RP91.mojonesF} físicos + ${META_RP91.mojonesS} sint. | `+
  `sin gaps | ${META_RP91.sentido}`;
</script>
</body>
