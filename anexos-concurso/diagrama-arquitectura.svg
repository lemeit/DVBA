<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#009aae"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c47a00"/>
    </marker>
    <linearGradient id="clientBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6f8"/>
    </linearGradient>
    <linearGradient id="coreBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#009aae"/>
      <stop offset="1" stop-color="#007a8a"/>
    </linearGradient>
    <linearGradient id="stackBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e0"/>
      <stop offset="1" stop-color="#fde4b8"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#005f6b">SIG Vial PBA — Arquitectura del sistema</text>
  <text x="700" y="85" text-anchor="middle" font-size="16" fill="#555">Cuatro clientes coordinados sobre un backend compartido</text>

  <!-- Caja 1: Aplicación móvil -->
  <g>
    <rect x="60" y="150" width="290" height="140" rx="14" ry="14" fill="url(#clientBg)" stroke="#009aae" stroke-width="3"/>
    <circle cx="115" cy="205" r="26" fill="#009aae"/>
    <rect x="102" y="188" width="26" height="38" rx="3" fill="#ffffff"/>
    <circle cx="115" cy="220" r="2.5" fill="#009aae"/>
    <text x="160" y="200" font-size="18" font-weight="bold" fill="#005f6b">Aplicación móvil</text>
    <text x="160" y="222" font-size="14" fill="#333">de campo (PWA)</text>
    <text x="80" y="258" font-size="12" fill="#555">Modo Básico + Avanzado</text>
    <text x="80" y="276" font-size="12" fill="#555">Instalable · offline · sello</text>
  </g>

  <!-- Caja 2: Portal de escritorio -->
  <g>
    <rect x="380" y="150" width="290" height="140" rx="14" ry="14" fill="url(#clientBg)" stroke="#009aae" stroke-width="3"/>
    <rect x="393" y="185" width="52" height="38" rx="3" fill="#009aae"/>
    <rect x="398" y="190" width="42" height="28" fill="#ffffff"/>
    <rect x="405" y="223" width="28" height="4" fill="#009aae"/>
    <rect x="395" y="227" width="48" height="3" fill="#009aae"/>
    <text x="465" y="200" font-size="18" font-weight="bold" fill="#005f6b">Portal de</text>
    <text x="465" y="222" font-size="18" font-weight="bold" fill="#005f6b">escritorio</text>
    <text x="400" y="258" font-size="12" fill="#555">Mapa + cola de aprobación</text>
    <text x="400" y="276" font-size="12" fill="#555">Reportes · Partes diarios</text>
  </g>

  <!-- Caja 3: Portal Plan Operativo -->
  <g>
    <rect x="700" y="150" width="290" height="140" rx="14" ry="14" fill="url(#clientBg)" stroke="#009aae" stroke-width="3"/>
    <rect x="715" y="188" width="14" height="38" rx="2" fill="#009aae"/>
    <rect x="732" y="188" width="14" height="38" rx="2" fill="#c47a00"/>
    <rect x="749" y="188" width="14" height="38" rx="2" fill="#00a86b"/>
    <text x="785" y="200" font-size="18" font-weight="bold" fill="#005f6b">Portal Plan</text>
    <text x="785" y="222" font-size="18" font-weight="bold" fill="#005f6b">Operativo</text>
    <text x="720" y="258" font-size="12" fill="#555">Kanban semanal del</text>
    <text x="720" y="276" font-size="12" fill="#555">jefe de zona</text>
  </g>

  <!-- Caja 4: Panel administrativo -->
  <g>
    <rect x="1020" y="150" width="290" height="140" rx="14" ry="14" fill="url(#clientBg)" stroke="#009aae" stroke-width="3"/>
    <g transform="translate(1055 205)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#009aae" stroke-width="4"/>
      <circle cx="0" cy="0" r="7" fill="#009aae"/>
      <rect x="-3" y="-27" width="6" height="8" fill="#009aae"/>
      <rect x="-3" y="19" width="6" height="8" fill="#009aae"/>
      <rect x="19" y="-3" width="8" height="6" fill="#009aae"/>
      <rect x="-27" y="-3" width="8" height="6" fill="#009aae"/>
    </g>
    <text x="1105" y="200" font-size="18" font-weight="bold" fill="#005f6b">Panel</text>
    <text x="1105" y="222" font-size="18" font-weight="bold" fill="#005f6b">administrativo</text>
    <text x="1040" y="258" font-size="12" fill="#555">Usuarios · Solicitudes</text>
    <text x="1040" y="276" font-size="12" fill="#555">Auditoría · Sistema</text>
  </g>

  <!-- Flechas hacia el centro -->
  <line x1="205" y1="290" x2="580" y2="425" stroke="#009aae" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="525" y1="290" x2="650" y2="425" stroke="#009aae" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="845" y1="290" x2="740" y2="425" stroke="#009aae" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1165" y1="290" x2="810" y2="425" stroke="#009aae" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Caja central: Backend -->
  <g>
    <rect x="380" y="430" width="640" height="200" rx="18" ry="18" fill="url(#coreBg)" stroke="#005f6b" stroke-width="3"/>
    <g transform="translate(440 490)">
      <ellipse cx="0" cy="0" rx="34" ry="10" fill="#ffffff"/>
      <path d="M -34 0 L -34 40 Q -34 50 0 50 Q 34 50 34 40 L 34 0" fill="#ffffff" stroke="none"/>
      <ellipse cx="0" cy="18" rx="34" ry="10" fill="none" stroke="#009aae" stroke-width="2"/>
      <ellipse cx="0" cy="35" rx="34" ry="10" fill="none" stroke="#009aae" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="34" ry="10" fill="none" stroke="#009aae" stroke-width="2"/>
    </g>
    <text x="700" y="480" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Base de datos + Storage</text>
    <text x="700" y="515" text-anchor="middle" font-size="16" fill="#e0f6fa">Una única base compartida por los cuatro clientes</text>
    <text x="700" y="565" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">PostgreSQL · Auth · Storage · Row-Level Security</text>
    <text x="700" y="600" text-anchor="middle" font-size="14" fill="#e0f6fa">Zonas · Roles · Fotos · Sello institucional</text>
  </g>

  <!-- Flecha hacia stack -->
  <line x1="700" y1="630" x2="700" y2="680" stroke="#c47a00" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <!-- Caja inferior: stack -->
  <g>
    <rect x="380" y="690" width="640" height="120" rx="14" ry="14" fill="url(#stackBg)" stroke="#c47a00" stroke-width="3"/>
    <text x="700" y="725" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a4c00">Infraestructura tecnológica</text>
    <text x="700" y="755" text-anchor="middle" font-size="14" fill="#333">Supabase · GitHub Pages · QGIS · Leaflet · Chart.js · jsPDF</text>
    <text x="700" y="778" text-anchor="middle" font-size="13" fill="#555">Código abierto · Planes gratuitos · Escalable a las 12 zonas</text>
    <text x="700" y="797" text-anchor="middle" font-size="12" font-style="italic" fill="#555">Costo institucional del piloto: cero pesos</text>
  </g>

  <text x="700" y="855" text-anchor="middle" font-size="12" fill="#888">Cada cliente expone a cada rol sólo lo que necesita para su tarea · La seguridad vive en la base de datos</text>
  <text x="700" y="875" text-anchor="middle" font-size="11" fill="#aaa">SIG Vial PBA · XLI Concurso sobre Temas Viales DVBA 2026</text>
</svg>
