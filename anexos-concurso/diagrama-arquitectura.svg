<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Sombras -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradientes de cajas cliente -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4fafc"/>
    </linearGradient>
    <!-- Backend gradient -->
    <linearGradient id="dbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00a8bd"/>
      <stop offset="100%" stop-color="#00758a"/>
    </linearGradient>
    <linearGradient id="dbInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f7fa"/>
      <stop offset="100%" stop-color="#cfeef3"/>
    </linearGradient>
    <!-- Colores flecha -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00758a"/>
    </marker>
  </defs>

  <!-- Fondo con banda superior -->
  <rect width="1600" height="1000" fill="#fbfcfd"/>
  <rect x="0" y="0" width="1600" height="90" fill="#003a44"/>

  <!-- Titulo -->
  <text x="50" y="45" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="0.5">SIG Vial PBA</text>
  <text x="50" y="72" font-size="15" fill="#7dd7e3" letter-spacing="0.3">Arquitectura del sistema · Cuatro clientes sobre un backend compartido</text>
  <text x="1550" y="45" text-anchor="end" font-size="13" fill="#7dd7e3">XLI Concurso Vial DVBA 2026</text>
  <text x="1550" y="65" text-anchor="end" font-size="11" fill="#5cb2c0" letter-spacing="0.3">DIAGRAMA DE REFERENCIA</text>

  <!-- Pipeline de bandas superior (chevron style) -->
  <g transform="translate(50 130)">
    <!-- Band 1: Campo -->
    <g>
      <path d="M 0 0 L 230 0 L 260 25 L 230 50 L 0 50 Z" fill="#00758a"/>
      <text x="115" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.4">CAMPO</text>
    </g>
    <!-- Band 2: Oficina zonal -->
    <g transform="translate(270 0)">
      <path d="M 0 0 L 230 0 L 260 25 L 230 50 L 0 50 L 30 25 Z" fill="#009aae"/>
      <text x="130" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.4">OFICINA ZONAL</text>
    </g>
    <!-- Band 3: Planeamiento -->
    <g transform="translate(540 0)">
      <path d="M 0 0 L 230 0 L 260 25 L 230 50 L 0 50 L 30 25 Z" fill="#00b1c7"/>
      <text x="130" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.4">PLANEAMIENTO</text>
    </g>
    <!-- Band 4: Administracion -->
    <g transform="translate(810 0)">
      <path d="M 0 0 L 230 0 L 260 25 L 230 50 L 0 50 L 30 25 Z" fill="#c47a00"/>
      <text x="130" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.4">ADMINISTRACIÓN</text>
    </g>
  </g>

  <!-- Lineas verticales divisorias entre carriles -->
  <g stroke="#c7d5da" stroke-width="1" stroke-dasharray="4 5">
    <line x1="315" y1="200" x2="315" y2="770"/>
    <line x1="585" y1="200" x2="585" y2="770"/>
    <line x1="855" y1="200" x2="855" y2="770"/>
  </g>

  <!-- CARRIL 1: CAMPO — Aplicación móvil -->
  <g transform="translate(70 220)">
    <rect x="0" y="0" width="230" height="200" rx="12" ry="12" fill="url(#cardBg)" stroke="#00758a" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Icono telefono -->
    <g transform="translate(115 55)">
      <rect x="-24" y="-30" width="48" height="70" rx="7" ry="7" fill="#003a44"/>
      <rect x="-20" y="-24" width="40" height="52" rx="1" ry="1" fill="#7dd7e3"/>
      <circle cx="0" cy="35" r="3" fill="#7dd7e3"/>
      <rect x="-6" y="-27" width="12" height="2" rx="1" fill="#7dd7e3"/>
    </g>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#003a44">Aplicación móvil</text>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#00758a">PWA instalable</text>
    <text x="115" y="175" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Modo Básico + Avanzado</text>
    <text x="115" y="190" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Offline · Sello institucional</text>
  </g>
  <!-- Etiqueta actor debajo -->
  <text x="185" y="450" text-anchor="middle" font-size="11" fill="#556" font-weight="600" letter-spacing="0.5">TÉCNICO · CAPATAZ</text>

  <!-- CARRIL 2: OFICINA — Portal escritorio -->
  <g transform="translate(340 220)">
    <rect x="0" y="0" width="230" height="200" rx="12" ry="12" fill="url(#cardBg)" stroke="#009aae" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Icono monitor -->
    <g transform="translate(115 55)">
      <rect x="-40" y="-30" width="80" height="52" rx="4" ry="4" fill="#003a44"/>
      <rect x="-36" y="-26" width="72" height="44" rx="1" fill="#7dd7e3"/>
      <rect x="-10" y="24" width="20" height="6" fill="#003a44"/>
      <rect x="-18" y="30" width="36" height="4" rx="1" fill="#003a44"/>
    </g>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#003a44">Portal de escritorio</text>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#009aae">Puesto de trabajo diario</text>
    <text x="115" y="175" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Mapa · Cola de aprobación</text>
    <text x="115" y="190" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Reportes · Partes diarios</text>
  </g>
  <text x="455" y="450" text-anchor="middle" font-size="11" fill="#556" font-weight="600" letter-spacing="0.5">JEFE DE DIVISIÓN</text>

  <!-- CARRIL 3: PLANEAMIENTO — Portal Plan Operativo -->
  <g transform="translate(610 220)">
    <rect x="0" y="0" width="230" height="200" rx="12" ry="12" fill="url(#cardBg)" stroke="#00b1c7" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Icono kanban -->
    <g transform="translate(115 55)">
      <rect x="-42" y="-30" width="24" height="60" rx="3" fill="#009aae"/>
      <rect x="-38" y="-24" width="16" height="10" rx="1" fill="#ffffff"/>
      <rect x="-38" y="-10" width="16" height="10" rx="1" fill="#ffffff" opacity="0.7"/>
      <rect x="-12" y="-30" width="24" height="60" rx="3" fill="#c47a00"/>
      <rect x="-8" y="-24" width="16" height="10" rx="1" fill="#ffffff"/>
      <rect x="-8" y="-10" width="16" height="10" rx="1" fill="#ffffff" opacity="0.7"/>
      <rect x="18" y="-30" width="24" height="60" rx="3" fill="#3aa76d"/>
      <rect x="22" y="-24" width="16" height="10" rx="1" fill="#ffffff"/>
      <rect x="22" y="-10" width="16" height="10" rx="1" fill="#ffffff" opacity="0.7"/>
    </g>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#003a44">Portal Plan Operativo</text>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#00b1c7">Kanban semanal</text>
    <text x="115" y="175" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Bandeja de tareas</text>
    <text x="115" y="190" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Asignación a cuadrillas</text>
  </g>
  <text x="725" y="450" text-anchor="middle" font-size="11" fill="#556" font-weight="600" letter-spacing="0.5">JEFE DE ZONA</text>

  <!-- CARRIL 4: ADMINISTRACIÓN — Panel administrativo -->
  <g transform="translate(880 220)">
    <rect x="0" y="0" width="230" height="200" rx="12" ry="12" fill="url(#cardBg)" stroke="#c47a00" stroke-width="2" filter="url(#softShadow)"/>
    <!-- Icono engranaje -->
    <g transform="translate(115 55)">
      <g>
        <circle cx="0" cy="0" r="24" fill="none" stroke="#c47a00" stroke-width="6"/>
        <circle cx="0" cy="0" r="9" fill="#c47a00"/>
        <g fill="#c47a00">
          <rect x="-4" y="-34" width="8" height="10" rx="1"/>
          <rect x="-4" y="24" width="8" height="10" rx="1"/>
          <rect x="24" y="-4" width="10" height="8" rx="1"/>
          <rect x="-34" y="-4" width="10" height="8" rx="1"/>
          <rect x="-4" y="-34" width="8" height="10" rx="1" transform="rotate(45)"/>
          <rect x="-4" y="24" width="8" height="10" rx="1" transform="rotate(45)"/>
          <rect x="24" y="-4" width="10" height="8" rx="1" transform="rotate(45)"/>
          <rect x="-34" y="-4" width="10" height="8" rx="1" transform="rotate(45)"/>
        </g>
      </g>
    </g>
    <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#003a44">Panel administrativo</text>
    <text x="115" y="150" text-anchor="middle" font-size="12" fill="#c47a00">Gestión del sistema</text>
    <text x="115" y="175" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Usuarios · Solicitudes</text>
    <text x="115" y="190" text-anchor="middle" font-size="11" fill="#556" font-style="italic">Auditoría · Sistema</text>
  </g>
  <text x="995" y="450" text-anchor="middle" font-size="11" fill="#556" font-weight="600" letter-spacing="0.5">ADMINISTRACIÓN</text>

  <!-- Flechas descendentes hacia backend -->
  <g stroke="#00758a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 185 480 L 185 545 Q 185 560 200 560 L 500 560" />
    <path d="M 455 480 L 455 555 L 500 555" />
    <path d="M 725 480 L 725 555 L 680 555" />
    <path d="M 995 480 L 995 545 Q 995 560 980 560 L 680 560" />
  </g>

  <!-- BACKEND — cinta amplia -->
  <g transform="translate(70 570)">
    <rect x="0" y="0" width="1040" height="180" rx="14" ry="14" fill="url(#dbBg)" filter="url(#softShadow)"/>
    <!-- Label vertical izquierda -->
    <rect x="0" y="0" width="46" height="180" rx="14" ry="14" fill="#003a44"/>
    <rect x="14" y="0" width="32" height="180" fill="#003a44"/>
    <text x="23" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#7dd7e3" letter-spacing="2" transform="rotate(-90 23 90)">BACKEND</text>

    <!-- Icono cilindro base de datos -->
    <g transform="translate(115 90)">
      <ellipse cx="0" cy="-30" rx="34" ry="10" fill="#e8f7fa"/>
      <path d="M -34 -30 L -34 30 Q -34 40 0 40 Q 34 40 34 30 L 34 -30" fill="#cfeef3"/>
      <ellipse cx="0" cy="-30" rx="34" ry="10" fill="none" stroke="#003a44" stroke-width="1.5"/>
      <ellipse cx="0" cy="-13" rx="34" ry="10" fill="none" stroke="#003a44" stroke-width="1.2" opacity="0.6"/>
      <ellipse cx="0" cy="4" rx="34" ry="10" fill="none" stroke="#003a44" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Titulo backend -->
    <text x="200" y="55" font-size="22" font-weight="700" fill="#ffffff">Base de datos + Storage compartidos</text>
    <text x="200" y="80" font-size="13" fill="#cfeef3" font-style="italic">Una única fuente de verdad para los cuatro clientes</text>

    <!-- 4 chips -->
    <g transform="translate(200 100)">
      <rect x="0" y="0" width="140" height="34" rx="6" fill="#ffffff" opacity="0.15"/>
      <text x="70" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">PostgreSQL</text>
    </g>
    <g transform="translate(350 100)">
      <rect x="0" y="0" width="140" height="34" rx="6" fill="#ffffff" opacity="0.15"/>
      <text x="70" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Auth</text>
    </g>
    <g transform="translate(500 100)">
      <rect x="0" y="0" width="140" height="34" rx="6" fill="#ffffff" opacity="0.15"/>
      <text x="70" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Storage</text>
    </g>
    <g transform="translate(650 100)">
      <rect x="0" y="0" width="200" height="34" rx="6" fill="#c47a00"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Row-Level Security</text>
    </g>
    <text x="200" y="160" font-size="12" fill="#e8f7fa">Zonas · Roles · Fotos · Sello institucional · Auditoría · Notificaciones</text>
  </g>

  <!-- Fila inferior: stack tecnologico -->
  <g transform="translate(70 780)">
    <rect x="0" y="0" width="1040" height="90" rx="10" ry="10" fill="#ffffff" stroke="#c47a00" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="20" y="30" font-size="12" font-weight="700" fill="#c47a00" letter-spacing="1.5">INFRAESTRUCTURA TECNOLÓGICA</text>
    <g font-size="13" fill="#003a44">
      <text x="20" y="55">Supabase</text>
      <text x="120" y="55" fill="#556">·</text>
      <text x="140" y="55">GitHub Pages</text>
      <text x="240" y="55" fill="#556">·</text>
      <text x="260" y="55">QGIS 3.42</text>
      <text x="345" y="55" fill="#556">·</text>
      <text x="365" y="55">Leaflet</text>
      <text x="430" y="55" fill="#556">·</text>
      <text x="450" y="55">Chart.js</text>
      <text x="520" y="55" fill="#556">·</text>
      <text x="540" y="55">jsPDF</text>
      <text x="595" y="55" fill="#556">·</text>
      <text x="615" y="55">Service Worker (PWA)</text>
    </g>
    <text x="20" y="76" font-size="11" fill="#556" font-style="italic">Todo código abierto · Planes gratuitos suficientes para el piloto · Escalable a las 12 zonas a costo marginal</text>
  </g>

  <!-- PANEL DERECHO: caracteristicas tecnicas -->
  <g transform="translate(1160 220)">
    <rect x="0" y="0" width="390" height="650" rx="12" ry="12" fill="#ffffff" stroke="#dbe4e8" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Cabecera -->
    <rect x="0" y="0" width="390" height="52" rx="12" ry="12" fill="#003a44"/>
    <rect x="0" y="40" width="390" height="12" fill="#003a44"/>
    <text x="24" y="33" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.4">CARACTERÍSTICAS DEL SISTEMA</text>

    <!-- Items -->
    <g transform="translate(24 82)">
      <g>
        <circle cx="8" cy="8" r="8" fill="#00a8bd"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Descentralización zonal</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Cada zona gestiona su propia operativa;</text>
        <text x="30" y="46" font-size="11.5" fill="#556">la gerencia central consulta y sugiere.</text>
      </g>
      <g transform="translate(0 80)">
        <circle cx="8" cy="8" r="8" fill="#00a8bd"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Mínimo privilegio + trazabilidad</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Cada acción sensible queda auditada</text>
        <text x="30" y="46" font-size="11.5" fill="#556">con motivo y autor.</text>
      </g>
      <g transform="translate(0 160)">
        <circle cx="8" cy="8" r="8" fill="#00a8bd"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Seguridad en la base de datos</text>
        <text x="30" y="30" font-size="11.5" fill="#556">RLS a nivel de fila individual;</text>
        <text x="30" y="46" font-size="11.5" fill="#556">no depende de la interfaz.</text>
      </g>
      <g transform="translate(0 240)">
        <circle cx="8" cy="8" r="8" fill="#00a8bd"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Operación en campo sin conexión</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Base cartográfica precargada;</text>
        <text x="30" y="46" font-size="11.5" fill="#556">sincronización diferida.</text>
      </g>
      <g transform="translate(0 320)">
        <circle cx="8" cy="8" r="8" fill="#c47a00"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Trazabilidad geográfica</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Cada foto cae en la zona del partido</text>
        <text x="30" y="46" font-size="11.5" fill="#556">donde ocurrió, sin importar el autor.</text>
      </g>
      <g transform="translate(0 400)">
        <circle cx="8" cy="8" r="8" fill="#c47a00"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">6</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Sello institucional único</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Un módulo compartido para las tres</text>
        <text x="30" y="46" font-size="11.5" fill="#556">interfaces de carga.</text>
      </g>
      <g transform="translate(0 480)">
        <circle cx="8" cy="8" r="8" fill="#c47a00"/>
        <text x="8" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">7</text>
        <text x="30" y="12" font-size="13" font-weight="700" fill="#003a44">Escalable a las 12 zonas viales</text>
        <text x="30" y="30" font-size="11.5" fill="#556">Sin agregar complejidad estructural;</text>
        <text x="30" y="46" font-size="11.5" fill="#556">a costo marginal.</text>
      </g>
    </g>
  </g>

  <!-- Nota al pie -->
  <text x="800" y="940" text-anchor="middle" font-size="12" fill="#556" letter-spacing="0.3">Cada cliente expone a cada rol solamente lo que necesita para su tarea · La seguridad institucional vive en el nivel más profundo posible</text>
  <text x="800" y="960" text-anchor="middle" font-size="10" fill="#889" letter-spacing="0.3">SIG Vial PBA · Plataforma web integral para el relevamiento y gestión de la red vial provincial · XLI Concurso sobre Temas Viales DVBA 2026</text>
</svg>
